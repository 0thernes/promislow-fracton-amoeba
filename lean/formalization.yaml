    Zero-Mathlib Lean 4.35.0 proofs of the 15 statements T1a-T3c as described above, plus
    non-vacuity and adversarial witnesses. Several theorem names describe more than the
    statement proves (see CLAIMS.md and ERRATA.md). sorry_count 0 refers to the proof files;
    lean/PalomarChallenge.lean is the comparator challenge template and intentionally has
    sorry bodies (outside the default build targets). Not formalized inside Lean: Ronkin
    quadrature values, the 25x25 winding-number grid, complex eigenvalue loop tracking,
    2-adic inverse supports and code dimensions k_p(L) (all computed in Rust and Python),
    string logical operators, determinant multiplicativity, and open problems (whether
    Z[P] or Q[P] has non-trivial units; the unit conjecture is false over C by Gardam,
    arXiv:2312.05240), general Gottschalk surjunctivity, and code distance of the CSS pairs.
