project:
  name: "Promislow-Fracton-Amoeba: Hantzsche-Wendt Group Rings, All-Prime Type-II Fracton Codes, and 3D Non-Hermitian B4 Eigenvalue Monodromy"
  description: >-
    Zero-Mathlib Lean 4.35.0 formalization of 15 headline theorems (T1a-T3c) plus
    concrete non-vacuity and adversarial witness suites uniting three interconnected
    open-problem frontiers:
    (Pillar I, ALG-035 / ANL-063) torsion-free Hantzsche-Wendt / Promislow group P,
    faithful 4-band Bloch matrix embedding Psi: R[P] -> M_4(R[x^+-1, y^+-1, z^+-1]),
    universal V_4 determinant invariance and constant-unit determinant law, exact
    8-sign-point closed-form factorizations (4 quaternionic perfect squares + 4 abelian/sum-of-squares),
    Gardam's 21-term unit mod 2, 89-term characteristic-0 determinant congruence
    det Psi(alpha_tilde) == 1 (mod 4), all-m 2-adic Hensel lift tower, strengthened
    2^21 no-sign-lift obstruction (P_1^2 - 31 not in {+1, -1}) for arbitrary even-sum p in Z[N],
    and P-equivariant finite-range bijective (surjunctive & reversible) linear cellular automaton;
    (Pillar II, QC-032 / CM-016) unit-twisted non-Abelian CSS commutation over arbitrary
    non-commutative rings, exhaustive 64-signed Haah cubic code discriminant classification
    (det(2Q) in {+-4, +-8, +-12}; 24 singular F_9 degenerations at p=3; smooth for all p >= 5),
    universal all-prime (p >= 2 and char 0) Type-II no-strings proof for Haah CC1 via
    explicit Z[t] rational parametrization with all 6 pairwise Bezout identities equal to 2,
    odd-prime torsion analysis ruling out odd-order F_p-rational roots for odd p <= 19 and
    certifying the first odd-L threshold at p = 23, L = 11 (k = 6), plus the first non-Abelian
    Hantzsche-Wendt fracton codes (Gardam-twisted mod 2 with 342 even Z[P] commutator terms
    and an intrinsic ring-universal HW fracton code);
    and (Pillar III, CM-018 / FLD-060) V_4-convex Ronkin global minimum strictly at mu = (0,0,0),
    exact quadrilateral characterization of Haah's double-amoeba A(f) cap A(g) with algebraic
    EP2 Jordan nilpotency (H != 0, H^2 = 0), and Artin braid group B_4 relations with exact
    full 24-element S_4 monodromy closure generated by Gardam crystal eigenvalue loops.
  authors:
    - name: "Alexander S. Donahue"
      orcid: "0009-0006-8168-9648"
      email: "0_0@0thernes.art"
      affiliation: "Independent Researcher, Spokane, WA, USA"
