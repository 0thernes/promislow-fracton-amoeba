project:
  name: "Promislow-Fracton-Amoeba: Hantzsche-Wendt Group Rings, All-Prime Type-II Fracton Codes, and 3D Non-Hermitian B4 Eigenvalue Monodromy"
  description: >-
    Zero-Mathlib Lean 4.35.0 formalization of 15 statements (T1a-T3c), with non-vacuity
    and adversarial witness suites, covering known facts, elementary identities and
    finite computations. Corrected after the 2026-11-26 statement audit (see ERRATA.md);
    the project name is the paper title and names topics, not formalized properties.
    (Pillar I) A normal-form model of the torsion-free Hantzsche-Wendt / Promislow group P
    (group axioms, relations, torsion-free); 4x4 Bloch evaluation preserves 1, + and x
    (the 4x4 representation is standard, Passman arXiv:2108.06570; injectivity is proved
    for a separate coefficient map psiFormal not linked to evaluation); a V_4 determinant
    statement that is trivial at the 8 integer sign points; 8 sign-point determinant
    identities for a separately defined matrix; Gardam's 21-term unit in F_2[P]
    (Gardam, Annals 2021) and determinant data for its {0,1}-lift (89 terms, constant 97,
    coefficient sum 945, == 1 mod 4); no 2-adic Hensel statement for Gardam's unit (only a
    generic identity); failure of the 8 sign-point determinant test for all 2^21 sign lifts
    of Gardam's support (a necessary condition for a unit; non-invertibility is not proved
    in Lean and is implied by Tabei arXiv:2608.00103); and the reversible linear cellular
    automaton attached to the unit.
    (Pillar II) An elementary unit-twisted CSS commutation identity (it also holds for u = 1);
    a finite enumeration of a defined signed-Haah discriminant function over 64 sign tuples;
    a lemma that no nontrivial monomial is constant on a rational parametrization of Haah's
    CC1 curve over integral domains with 2 != 0 containing roots of three quadratics of
    discriminant 5, plus one F_4 line (string operators are not formalized; compare Haah
    arXiv:1101.1962 and Kim arXiv:1202.0052); a search showing p = 23 is the first odd prime
    with an F_p-rational odd-order CC1 point (k_23(11) = 6 is a Rust/Python computation);
    and two explicit CSS stabilizer pairs over F_2[P] / Z[P] (no distance, logical-qubit or
    fracton property is formalized).
    (Pillar III) A non-strict origin-minimum lemma for midpoint-convex, sign-flip-invariant
    functions Q^3 -> Q (no Ronkin function in Lean); integer-point checks of defined amoeba
    inequality predicates and a nonzero nilpotent 2x2 matrix; and generation of S_4 by two
    permutations, with braid relations checked on S_4 (no braid group B_4 is defined; the
    monodromy identification is numerical).
