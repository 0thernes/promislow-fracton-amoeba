fidelity:
  divergences: >-
    Numerical Ronkin quadrature values, 25x25 winding-number maps, and complex eigenvalue
    loop tracking are labeled numerical_approximation and compared between Rust and Python.
    Divergences between the stated claims and the Lean statements (2026-11-26 audit):
    T1c is trivial at integer sign points; T1b injectivity is for psiFormal, not the
    evaluation map; T1d-T1f use matrices defined separately from Psi; T1e has no Hensel
    statement; T1f proves failure of a necessary determinant test, not non-invertibility;
    T2c defines no string operators and needs roots of discriminant-5 quadratics; T2d has
    no code dimension; T3a is non-strict and has no Ronkin function; T3b and T3c define no
    amoeba, braid group or monodromy.

review:
  status: "self-assessed"
  notes: >-
    Not externally peer-reviewed. Kernel-checked by Lean (lake build, leanchecker); the 16
    comparator targets in lean/comparator.json were also accepted by 6 independent kernels
    via lake comparator --config comparator.json --paranoid (Lean default,
    leanchecker-paranoid, lean4lean, nanoda_bin, con-leche, con-ron), with 0 warnings,
    0 proof sorries, 0 native_decide, and NonVacuity & AdversarialTests witnesses.
    An independent statement audit on 2026-11-26 rebuilt the project (pass) and found the
    divergences listed under fidelity.
