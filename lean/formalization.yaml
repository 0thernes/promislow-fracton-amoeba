sources:
  - title: "Promislow-Fracton-Amoeba: Hantzsche-Wendt Group Rings, All-Prime Type-II Fracton Codes, and 3D Non-Hermitian B4 Eigenvalue Monodromy (v1.0.0)"
    authors:
      - "Alexander S. Donahue"
    id: "https://github.com/0thernes/promislow-fracton-amoeba"
    type: "original-proof"
    relationship: "other"
    note: >-
      Original formalization and companion AMS-LaTeX preprint first presented in this
      repository. No external DOI, arXiv ID, or peer review is claimed prior to confirmed
      external assignment.
  - title: "A counterexample to the unit conjecture for group rings"
    authors:
      - "Giles Gardam"
    id: "https://doi.org/10.4007/annals.2021.194.3.9"
    type: "paper"
    relationship: "background"
    note: "Constructs the 21-term unit in F_2[P] analyzed in Theorems T1e, T1f, T1g, T2e, and T3c."
  - title: "More counterexamples to the unit conjecture for group rings"
    authors:
      - "Alan G. Murray"
    id: "https://arxiv.org/abs/2106.02147"
    type: "paper"
    relationship: "background"
    note: "Extends Gardam's construction to prime characteristics p. Characteristic zero was later settled over C by Gardam, Non-trivial units of complex group rings, arXiv:2312.05240; whether Z[P] or Q[P] has non-trivial units remains open."
  - title: "Local stabilizer codes in three dimensions without string logical operators"
    authors:
      - "Jeongwan Haah"
    id: "https://doi.org/10.1103/PhysRevA.83.042330"
    type: "paper"
    relationship: "background"
    note: "Introduces Haah Cubic Code 1 and its no-strings property for qubits; T2b-T2d formalize algebraic facts about its curve, not string operators."
  - title: "Commuting Pauli Hamiltonians as maps between free modules"
    authors:
      - "Jeongwan Haah"
    id: "https://doi.org/10.1007/s00220-013-1810-2"
    type: "paper"
    relationship: "background"
    note: "Establishes the Laurent polynomial module formalism extended to non-Abelian R[P] in T2a and T2e."
  - title: "Amoeba Formulation of Non-Bloch Band Theory in Arbitrary Dimensions"
    authors:
      - "Hong-Yi Wang"
      - "Fei Song"
      - "Zhong Wang"
    id: "https://doi.org/10.1103/PhysRevX.14.021011"
    type: "paper"
    relationship: "background"
    note: "Formulates multi-dimensional non-Hermitian amoebae and Ronkin functions; T3a and T3b are elementary lemmas, and no amoeba or Ronkin function is defined in Lean."
  - title: "Homotopy characterization of non-Hermitian Hamiltonians"
    authors:
      - "Charles C. Wojcik"
      - "Xiao-Qi Sun"
      - "Tomas Bzdusek"
      - "Shanhui Fan"
    id: "https://doi.org/10.1103/PhysRevB.101.205417"
    type: "paper"
    relationship: "background"
    note: "Connects non-Hermitian multiband loops to braid groups B_n and S_n monodromy; T3c formalizes only S_4 permutation facts, and the monodromy identification is numerical."

